[mod-name]
resource-balance=Resource Balance

[mod-description]
resource-balance=A floating panel with chosen items and fluids: produced, consumed and balance per minute, per planet or summed over all planets. Lists, output targets, watcher with a log, stock in logistic networks and tanks, machine state history, root causes and factory idle view.

[controls]
resbal-toggle=Toggle resource balance
resbal-add-hovered=Resource Balance: add what is under the cursor

[shortcut-name]
resbal-toggle=Resource balance

[mod-setting-name]
resbal-number-format=Number format
resbal-close-on-esc=Close the panel with Esc
resbal-refresh=Panel refresh
resbal-history-interval=Machine state history
resbal-scan-interval=Machine rescan
resbal-watch-chat=Watcher: chat message
resbal-watch-sound=Watcher: sound
resbal-watch-marks=Watcher: marks on the chart

[mod-setting-description]
resbal-number-format=How large numbers are shown.\nAuto: k from 10,000 (5458, 17.7k).\nShort: k from 1000 (5.5k, 17.7k).\nFull: with a space between thousands (5 458, 17 734).
resbal-close-on-esc=Esc closes the resource balance panel.\nThe panel will then also close when you open your inventory, a machine or another game window.\nThe chart window always closes with Esc.
resbal-refresh=How often numbers and mini charts are refreshed.\nAuto: 5s — every 5 s, 1m — every 30 s, longer periods — every minute.
resbal-history-interval=Background tracking: how often every machine with a recipe is checked to know which share of time it worked, had no input, a full output or no power (last 30 minutes).\nThe load is spread evenly over ticks. On a very large base you can check less often or turn it off.
resbal-scan-interval=How often the Producers & consumers tab searches for machines again: counts, states (no input, output full…), show on map.\nMore often = fresher states, but on a very large base the search may cause a short hitch. Only while the tab is open.
resbal-watch-chat=Print a chat message when a resource first breaks a watcher threshold.\nThe red bell in the row and the counter on the mod button always work.
resbal-watch-sound=Play a sound when a resource first breaks a watcher threshold.
resbal-watch-marks=When the watcher fires and when the resource recovers, a mark is put on that resource's chart: orange — broken threshold, green — recovered, grey — paused, snoozed or threshold changed.\nUp to 30 automatic marks are kept; they don't push out your own marks.

