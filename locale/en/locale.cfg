[mod-name]
resource-balance=Resource Balance

[mod-description]
resource-balance=A floating panel with chosen items and fluids: produced, consumed and balance per minute, per planet or summed over all planets. Several lists with export, watcher alerts, stock in logistic networks, what changed, idle machines per recipe and deficit cause hints.

[controls]
resbal-toggle=Toggle resource balance

[shortcut-name]
resbal-toggle=Resource balance

[mod-setting-name]
resbal-number-format=Number format
resbal-close-on-esc=Close the panel with Esc
resbal-refresh=Panel refresh
resbal-watch-chat=Watcher: chat message
resbal-watch-sound=Watcher: sound

[mod-setting-description]
resbal-number-format=How large numbers are shown.\nAuto: k from 10,000 (5458, 17.7k).\nShort: k from 1000 (5.5k, 17.7k).\nFull: with a space between thousands (5 458, 17 734).
resbal-close-on-esc=Esc closes the resource balance panel.\nThe panel will then also close when you open your inventory, a machine or another game window.\nThe chart window always closes with Esc.
resbal-refresh=How often numbers and mini charts are refreshed.\nAuto: 5s — every 5 s, 1m — every 30 s, longer periods — every minute.
resbal-watch-chat=Print a chat message when a resource first breaks a watcher threshold.\nThe red bell in the row and the counter on the mod button always work.
resbal-watch-sound=Play a sound when a resource first breaks a watcher threshold.

[string-mod-setting]
resbal-number-format-auto=Auto (k from 10,000)
resbal-number-format-short=Short (k from 1000)
resbal-number-format-full=Full (1 000)
resbal-refresh-auto=Auto (by period)
resbal-refresh-1=Every second
resbal-refresh-5=Every 5 s
resbal-refresh-10=Every 10 s

