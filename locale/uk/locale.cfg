delivery-tooltip=Машини виробляють, але продукт не забирають: перевір маніпулятори, конвеєри, потяги чи роботів.\nТакож причиною може бути забитий побічний продукт рецепта.\nКлік по синьому лічильнику в таблиці нижче — показати таку машину на мапі.
