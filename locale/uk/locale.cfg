byproduct-tooltip=Машина не почне новий крафт, доки з виходу не заберуть побічний продукт, — тому основний ресурс не виробляється.\nВизначено за вмістом виходу машин під час перепошуку — це оцінка.\nСпоживачі — лише машини з рецептами: якщо побічний продукт спалюють як паливо чи вивозять, мод цього не бачить.
