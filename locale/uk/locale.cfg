help-tooltip=[font=default-bold]Керування[/font]\n__CONTROL__resbal-toggle__ — відкрити або закрити панель\n__CONTROL__resbal-add-hovered__ — додати в список те, що під курсором (предмет, рідину, рецепт, машину, бур)\nКлік по ресурсу — вікно ресурсу · ПКМ або Ctrl+клік — додати на відкритий графік\nКлік по заголовку колонки — сортування\nЗначок у рядку — сторож і ціль випуску · хрестик — прибрати\n\n[font=default-bold]Вікно ресурсу[/font] — вкладки «Графік», «Виробники й споживачі», «Першопричини», «Сторож»\n[font=default-bold]Діагностика[/font] — простої фабрики й журнал сторожа\n«Дефіцит» — усе, що в мінусі на планеті; «+» — додати до списку\nEsc — закрити діалог, потім вікно
