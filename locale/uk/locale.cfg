[mod-name]
resource-balance=Баланс ресурсів

[mod-description]
resource-balance=Плаваюча панель з обраними предметами й рідинами: вироблено, спожито і баланс за хвилину, по планеті або сумою по всіх. Списки, цілі випуску, сторож із журналом, запас у логістичних мережах і резервуарах, історія станів машин, першопричини й простої фабрики.

[controls]
resbal-toggle=Відкрити/закрити баланс ресурсів
resbal-add-hovered=Баланс ресурсів: додати те, що під курсором

[shortcut-name]
resbal-toggle=Баланс ресурсів

[mod-setting-name]
resbal-number-format=Формат чисел
resbal-close-on-esc=Закривати панель через Esc
resbal-refresh=Оновлення панелі
resbal-history-interval=Історія станів машин
resbal-scan-interval=Перепошук машин
resbal-watch-chat=Сторож: повідомлення в чат
resbal-watch-sound=Сторож: звук
resbal-watch-marks=Сторож: позначки на графіку

[mod-setting-description]
resbal-number-format=Як показувати великі числа.\nАвто: k від 10 000 (5458, 17.7k).\nСкорочено: k уже від 1000 (5.5k, 17.7k).\nПовністю: з пробілом між тисячами (5 458, 17 734).
resbal-close-on-esc=Esc закриває панель балансу ресурсів.\nАле тоді вона закриватиметься й тоді, коли ви відкриваєте інвентар, машину чи інше вікно гри.\nВікно графіка закривається через Esc завжди.
resbal-refresh=Як часто оновлювати числа й міні-графіки.\nАвто: 5с — кожні 5 с, 1хв — кожні 30 с, довші проміжки — щохвилини.
resbal-history-interval=Фоновий облік: як часто опитувати кожну машину з рецептом, щоб знати, яку частку часу вона працювала, стояла без входу, з повним виходом чи без енергії (останні 30 хв).\nНавантаження розподілене рівномірно по тіках. На дуже великій базі можна рідше або вимкнути.
resbal-scan-interval=Як часто вкладка «Виробники й споживачі» заново шукає машини: кількість, стани (немає входу, вихід повний…), показ на мапі.\nЧастіше — свіжіші стани, але на дуже великій базі можливий короткий ривок у момент пошуку. Діє лише поки вкладка відкрита.
resbal-watch-chat=Коли ресурс уперше порушує поріг сторожа, написати про це в чат.\nЧервоний дзвіночок у рядку і лічильник на кнопці мода працюють завжди.
resbal-watch-sound=Програвати звук, коли ресурс уперше порушує поріг сторожа.
resbal-watch-marks=Коли сторож спрацьовує і коли ресурс відновлюється, на графіку цього ресурсу ставиться позначка: помаранчева — порушення, зелена — відновлення, сіра — пауза, відкладення чи зміна порогу.\nАвтопозначок зберігається до 30, ручних позначок вони не витісняють.

