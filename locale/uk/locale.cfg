target-idle-other=Потужності вистачає (≈__1__/хв), але машини працюють не на повну — перевір їх стан.
target-verdict-tooltip=Порівняння цілі з фактичним випуском (за проміжок вкладки) і максимальною потужністю машин зі сканування: швидкість × вихід за крафт × продуктивність. Кількість машин — лише для головного рецепта, тому це оцінка: альтернативні рецепти й побічні продукти її змінюють.
buffer=Схоже, склад повний: виробники стоять із заповненим виходом, а споживачі працюють — споживання йде з запасу. Це не дефіцит.
buffer-tooltip=Типово для міських блоків і перевезень потягами: склад на станції чи резервуари заповнені, виробництво чекає, а споживачі в іншому блоці беруть із запасу. За коротким проміжком баланс тоді від'ємний, хоча нестачі немає — подивись проміжок 1г.\nЯкщо споживачі почнуть стояти без входу, мод знову покаже причину й «перевір доставку».
