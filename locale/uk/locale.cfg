history-tooltip=Яку частку часу машини-виробники цього ресурсу на планеті провели в кожному стані — оцінка за фоновими спостереженнями (кожна машина опитується раз на кілька секунд). Допомагає, коли «прийшов перевірити — усе працює», а випуск низький.\nВікно: 1хв → 5 хв, 10хв → 10 хв, 1г і 10г → 30 хв (більше не зберігається).
