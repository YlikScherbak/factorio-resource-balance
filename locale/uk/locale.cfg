idle-info=Рецепти, де машини найбільше стояли, — за втраченим машино-часом (частка простою × машин), за фоновою історією станів машин.\nСмужка «Простій» — відносно першого рядка. Червоний продукт — простій шкодить (продукту бракує); звичайний — продукту вистачає, машина просто чекає попиту.\nРецепти, що працювали від 95% часу, не показано. Клік по рецепту — виробники й споживачі його продукту.
