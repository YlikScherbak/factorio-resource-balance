resbal-number-format-auto=Авто (k від 10 000)
resbal-number-format-short=Скорочено (k від 1000)
resbal-number-format-full=Повністю (1 000)
resbal-refresh-auto=Авто (за проміжком)
resbal-refresh-1=Щосекунди
resbal-refresh-5=Кожні 5 с
resbal-refresh-10=Кожні 10 с

