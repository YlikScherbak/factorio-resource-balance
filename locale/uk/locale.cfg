marks-hint=Позначка ставиться на поточний момент і видна на графіку кожного ресурсу (біла пунктирна лінія, текст — у підказці). Зберігається до __1__ позначок.\nСторож ставить власні позначки (помаранчева — спрацював, зелена — відновлено, сіра — пауза, відкладено чи поріг змінено) лише на графік свого ресурсу, до __2__; твоїх вони не витісняють.
