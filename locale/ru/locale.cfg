[mod-name]
resource-balance=Баланс ресурсов

[mod-description]
resource-balance=Плавающая панель с выбранными предметами и жидкостями: произведено, потреблено и баланс в минуту, по планете или суммой по всем. Списки, цели выпуска, сторож с журналом, запас в логистических сетях и резервуарах, история состояний машин, первопричины и простои фабрики.

[controls]
resbal-toggle=Открыть/закрыть баланс ресурсов
resbal-add-hovered=Баланс ресурсов: добавить то, что под курсором

[shortcut-name]
resbal-toggle=Баланс ресурсов

[mod-setting-name]
resbal-number-format=Формат чисел
resbal-close-on-esc=Закрывать панель по Esc
resbal-refresh=Обновление панели
resbal-history-interval=История состояний машин
resbal-scan-interval=Перепоиск машин
resbal-watch-chat=Сторож: сообщение в чат
resbal-watch-sound=Сторож: звук
resbal-watch-marks=Сторож: отметки на графике

[mod-setting-description]
resbal-number-format=Как показывать большие числа.\nАвто: k от 10 000 (5458, 17.7k).\nСокращённо: k уже от 1000 (5.5k, 17.7k).\nПолностью: с пробелом между тысячами (5 458, 17 734).
resbal-close-on-esc=Esc закрывает панель баланса ресурсов.\nНо тогда она будет закрываться и при открытии инвентаря, машины или другого окна игры.\nОкно графика закрывается по Esc всегда.
resbal-refresh=Как часто обновлять числа и мини-графики.\nАвто: 5с — каждые 5 с, 1мин — каждые 30 с, более длинные промежутки — раз в минуту.
resbal-history-interval=Фоновый учёт: как часто опрашивать каждую машину с рецептом, чтобы знать, какую долю времени она работала, стояла без входа, с полным выходом или без энергии (последние 30 мин).\nНагрузка распределена равномерно по тикам. На очень большой базе можно реже или выключить.
resbal-scan-interval=Как часто вкладка «Производители и потребители» заново ищет машины: количество, состояния (нет входа, выход заполнен…), показ на карте.\nЧаще — более свежие состояния, но на очень большой базе возможен короткий рывок в момент поиска. Действует только пока вкладка открыта.
resbal-watch-chat=Когда ресурс впервые нарушает порог сторожа, написать об этом в чат.\nКрасный колокольчик в строке и счётчик на кнопке мода работают всегда.
resbal-watch-sound=Проигрывать звук, когда ресурс впервые нарушает порог сторожа.
resbal-watch-marks=Когда сторож срабатывает и когда ресурс восстанавливается, на графике этого ресурса ставится отметка: оранжевая — нарушение, зелёная — восстановление, серая — пауза, откладывание или изменение порога.\nАвтоотметок хранится до 30, ручные отметки они не вытесняют.

