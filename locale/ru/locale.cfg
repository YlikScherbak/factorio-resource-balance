target-no-machines=На планете нет машин, которые его производят, — цель не достичь без новых машин (или это добыча либо импорт).
target-idle-no_input=Мощности хватает (≈__1__/мин), но машины стоят без входа — не хватает ингредиентов (см. «Искать глубже»).
