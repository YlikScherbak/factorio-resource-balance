target-verdict-tooltip=Сравнение цели с фактическим выпуском (за промежуток вкладки) и максимальной мощностью машин из сканирования: скорость × выход за крафт × продуктивность. Количество машин — только для главного рецепта, поэтому это оценка: альтернативные рецепты и побочные продукты её меняют.
buffer=Похоже, склад полон: производители стоят с заполненным выходом, а потребители работают — потребление идёт из запаса. Это не дефицит.
buffer-tooltip=Типично для городских блоков и перевозок поездами: склад на станции или резервуары заполнены, производство ждёт, а потребители в другом блоке берут из запаса. На коротком промежутке баланс тогда отрицательный, хотя нехватки нет — посмотри промежуток 1ч.\nЕсли потребители начнут стоять без входа, мод снова покажет причину и «проверь доставку».
root-buffer=← склад полон: производители ждут, потребители работают из запаса — не причина
