byproduct-tooltip=Машина не начнёт новый крафт, пока с выхода не заберут побочный продукт, — поэтому основной ресурс не производится.\nОпределено по содержимому выхода машин во время перепоиска — это оценка.\nПотребители — только машины с рецептами: если побочный продукт сжигают как топливо или вывозят, мод этого не видит.
